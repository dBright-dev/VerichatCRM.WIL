# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Both dotnet steps name VerichatCRM.API.csproj, for the reason spelled out in
# dev2_verichatcrm.yml: bare steps at this root resolve the solution, publish six
# projects into one folder, and fail on the duplicate appsettings.json paths, so this
# workflow never deployed anything. This app is the API and VerichatCRM is the web
# tier - the two artifacts are different apps and cannot share a publish folder.

name: Build and deploy ASP.Net Core app to Azure Web App - verichat-api

on:
  push:
    branches:
      - 'dev2'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build VerichatCRM.API/VerichatCRM.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish VerichatCRM.API/VerichatCRM.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9ACAE3D69F4542018D470395E6CDFAF8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FEF75208184B430CB150FDA398FFA1CF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A1583C22DA0F4C47B02ADED854B78783 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'verichat-api'
          slot-name: 'Production'
          package: .
          