# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Both dotnet steps name VerichatCRM.Web.csproj. The generated version of this file
# ran them bare, and at this repository's root bare means "the one solution here", so
# publish walked all six projects into one folder and died on NETSDK1152 - Core,
# Infrastructure, API, Web and Tests all carry an appsettings.json and a
# dotnet-tools.json at the same relative path. The job never produced an artifact, so
# every push to dev2 failed this workflow and the Azure web app kept whatever it was
# last published with by hand. VerichatCRM.API has the same fix in
# dev2_verichat-api.yml; each workflow must name its own project, because the two
# deploy to different apps and one artifact folder cannot hold both.

name: Build and deploy ASP.Net Core app to Azure Web App - VerichatCRM

on:
  push:
    branches:
      - 'dev2'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build VerichatCRM.Web/VerichatCRM.Web.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish VerichatCRM.Web/VerichatCRM.Web.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B2D48BFD11F04959B1AF85546CE7A875 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F7D9FDA7019B4CDBBFE59C66D5B1CDDC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_32BC9757411E44E0A77A386422DF0C04 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'VerichatCRM'
          slot-name: 'Production'
          package: .
          