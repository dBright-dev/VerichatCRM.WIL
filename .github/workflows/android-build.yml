name: Verichat Mobile Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18.x'
  ANDROID_COMPILE_SDK: 34
  ANDROID_TOOLS_VERSION: 34.0.0

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx expo lint

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --console=plain -Partifact=outputs

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: verichat-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-ios:
    runs-on: macOS-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx expo lint

      - name: Build iOS
        run: |
          npx expo run:ios --no-fast-sync --no-config-check
        shell: bash

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: |
          npm run web -- --output=dist --minify

      - name: Deploy to MonsterASP
        run: |
          echo "Deploying to MonsterASP..."
          curl -X POST https://monsterasp.example.com/deploy \
            -H "Content-Type: application/json" \
            -d '{"project": "verichat-mobile", "environment": "production"}'
        env:
          MONSTERASP_API_KEY: ${{ secrets.MONSTERASP_API_KEY }}

  update-api:
    runs-on: ubuntu-latest
    needs: build-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy API to MonsterASP
        run: |
          echo "Updating API/Web to MonsterASP..."
          curl -X POST https://monsterasp.example.com/deploy \
            -H "Content-Type: application/json" \
            -d '{
              "project": "verichat-api",
              "environment": "production",
              "branch": "${{ github.ref_name }}"
            }'
        env:
          MONSTERASP_API_KEY: ${{ secrets.MONSTERASP_API_KEY }}
