name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore VerichatCRM.slnx
      - run: dotnet test VerichatCRM.Tests/VerichatCRM.Tests.csproj --configuration Release --no-restore
      - run: dotnet build VerichatCRM.slnx --configuration Release --no-restore

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VerichatMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VerichatMobile/package-lock.json
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
